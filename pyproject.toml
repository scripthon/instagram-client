[project]
name = "instagram-client"
version = "0.1.0"
description = "Instagram logged-out client: profil, post, oembed (hasil reverse engineering instagram.com)"
readme = "README.md"
authors = [
    { name = "scripthon", email = "scripthon.build@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx[http2]>=0.28.1",
]

[project.scripts]
instagram-client = "instagram_client.ig_scraper:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
